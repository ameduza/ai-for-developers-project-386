name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GH_MCP_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

# Use GH_MCP_TOKEN so resources created by release-please can trigger
# subsequent workflows.
# Repository Settings > Actions > General must allow Actions to create PRs.
