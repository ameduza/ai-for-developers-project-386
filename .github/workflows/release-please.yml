name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

# The action defaults to GITHUB_TOKEN. Resources it creates do not trigger
# further workflows; use a separate token only if that behavior is required.
# Repository Settings > Actions > General must allow Actions to create PRs.
